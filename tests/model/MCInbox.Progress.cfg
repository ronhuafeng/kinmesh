\* Both progress properties, and every invariant, with 3 deliveries: TLC
\* takes more than a day over the liveness graph of 4. BacklogCap is 1, so
\* a run that gives way pauses its agent, which progress must survive.
CONSTANTS
  Deliveries = {1, 2, 3}
  Workers = {w1, w2}
  AgentOf <- MCAgentOf3
  TaskOf <- MCTaskOf3
  NoTask = "none"
  Concurrency = 1
  BacklogCap = 1
  MaxFaults = 1
  MaxActs = 1
  Bugs = {}
SPECIFICATION Spec
INVARIANTS TypeOK SlotBound OneRunPerTask OneRun PublishedOnce BacklogBound Settled
PROPERTIES FinalStays DispatchedEnds QueuedDispatches
CHECK_DEADLOCK FALSE
