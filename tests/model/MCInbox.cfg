\* Every invariant with 4 deliveries; MCInbox.Progress.cfg checks progress.
\* BacklogCap is 1, not the product's 3: four deliveries never reach 3.
\* Deadlock is not checked; Settled says which states may have no successor.
CONSTANTS
  Deliveries = {1, 2, 3, 4}
  Workers = {w1, w2}
  AgentOf <- MCAgentOf
  TaskOf <- MCTaskOf
  NoTask = "none"
  Concurrency = 1
  BacklogCap = 1
  MaxFaults = 1
  MaxActs = 1
  Bugs = {}
SPECIFICATION Spec
SYMMETRY MCWorkerSymmetry
INVARIANTS TypeOK SlotBound OneRunPerTask OneRun PublishedOnce BacklogBound Settled
PROPERTIES FinalStays
CHECK_DEADLOCK FALSE
