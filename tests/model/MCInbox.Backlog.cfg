\* The safety invariants with BacklogCap 2: a run that gave way does not pause
\* the agent, so only the task rule keeps a second run of its task back.
CONSTANTS
  Deliveries = {1, 2, 3, 4}
  Workers = {w1, w2}
  AgentOf <- MCAgentOf
  TaskOf <- MCTaskOf
  NoTask = "none"
  Concurrency = 1
  BacklogCap = 2
  MaxFaults = 1
  MaxActs = 1
  Bugs = {}
SPECIFICATION Spec
SYMMETRY MCWorkerSymmetry
INVARIANTS TypeOK SlotBound OneRunPerTask OneRun PublishedOnce BacklogBound Settled
CHECK_DEADLOCK FALSE
