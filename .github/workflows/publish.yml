name: Publish image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.sha }}
jobs:
  build:
    strategy:
      matrix:
        image:
          - name: kinmesh
            context: .
          - name: kinmesh-t3
            context: deploy/t3
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and push ${{ matrix.image.name }} for linux/${{ matrix.arch }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ github.sha }}-${{ matrix.arch }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t "$IMAGE" "${{ matrix.image.context }}"
          docker push "$IMAGE"
  manifest:
    needs: build
    strategy:
      matrix:
        name: [kinmesh, kinmesh-t3]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: One tag for both architectures
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create -t "$IMAGE" "$IMAGE-amd64" "$IMAGE-arm64"
          docker buildx imagetools inspect "$IMAGE"
  # Proposes the published hub to the deployment: a pull request on the infra
  # repository setting the hub image's tag to this commit. Skipped until the
  # owner adds the token (docs/operations.md, Deploying a commit).
  deploy:
    needs: manifest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: infra
    permissions:
      contents: read
    # One at a time; a newer pending run replaces an older one.
    concurrency:
      group: deploy-infra
    env:
      HAS_TOKEN: ${{ secrets.INFRA_PR_TOKEN != '' }}
    steps:
      - name: Open or update the infra pull request
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.INFRA_PR_TOKEN }}
          OWN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: weavertech-group/infra
          FILE: apps/kinmesh/kustomization.yaml
          BRANCH: deploy/kinmesh-hub
          IMAGE: ghcr.io/${{ github.repository_owner }}/kinmesh
        run: |
          set -euo pipefail
          # Only the newest commit on main is proposed; an older run that
          # finishes late changes nothing.
          head=$(GH_TOKEN="$OWN_TOKEN" gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main is at $head now; its own run proposes it."
            exit 0
          fi
          cd "$RUNNER_TEMP"
          base=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          gh api "repos/$REPO/contents/$FILE?ref=$base" --jq .content | base64 -d > current.yaml
          # The tag under this image's entry, and nothing else.
          awk -v entry="  - name: $IMAGE" -v tag="$GITHUB_SHA" '
            /^  - name: / { inside = ($0 == entry) }
            inside && /^    newTag: / { $0 = "    newTag: " tag; changed = 1 }
            { print }
            END { if (!changed) exit 1 }
          ' current.yaml > updated.yaml
          if cmp -s current.yaml updated.yaml; then
            echo "The deployment already runs $GITHUB_SHA."
            exit 0
          fi
          short=${GITHUB_SHA::7}
          # The branch is this workflow's alone: it starts again from main.
          if gh api "repos/$REPO/git/ref/heads/$BRANCH" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH" -f sha="$base" -F force=true --silent
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$base" --silent
          fi
          gh api -X PUT "repos/$REPO/contents/$FILE" \
            -f branch="$BRANCH" \
            -f sha="$(gh api "repos/$REPO/contents/$FILE?ref=$BRANCH" --jq .sha)" \
            -f message="deploy: Kinmesh hub $short" \
            -f content="$(base64 -w0 updated.yaml)" --silent
          title="deploy: Kinmesh hub $short"
          body="Runs \`$IMAGE:$GITHUB_SHA\`, published from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA."
          open=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh pr edit "$open" -R "$REPO" --title "$title" --body "$body"
          else
            gh pr create -R "$REPO" --base main --head "$BRANCH" --title "$title" --body "$body"
          fi
