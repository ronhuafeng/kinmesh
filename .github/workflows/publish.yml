name: Publish image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.sha }}
jobs:
  build:
    strategy:
      matrix:
        image:
          - name: kinmesh
            context: .
          - name: kinmesh-t3
            context: deploy/t3
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and push ${{ matrix.image.name }} for linux/${{ matrix.arch }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ github.sha }}-${{ matrix.arch }}
          NAME: ${{ matrix.image.name }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # The hub reports the commit it was built from on /health.
          args=()
          if [ "$NAME" = kinmesh ]; then args=(--build-arg "KINMESH_VERSION=$GITHUB_SHA"); fi
          docker build "${args[@]}" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t "$IMAGE" "${{ matrix.image.context }}"
          docker push "$IMAGE"
  manifest:
    needs: build
    strategy:
      matrix:
        name: [kinmesh, kinmesh-t3]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: One tag for both architectures
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create -t "$IMAGE" "$IMAGE-amd64" "$IMAGE-arm64"
          docker buildx imagetools inspect "$IMAGE"
  # Deploys the published hub: commits the hub image's tag, set to this
  # commit, to the infra repository's main, which Flux applies. Skipped until
  # the owner adds the token (docs/operations.md, Deploying a commit).
  deploy:
    needs: manifest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: infra
    permissions:
      contents: read
    # One at a time; a newer pending run replaces an older one.
    concurrency:
      group: deploy-infra
    env:
      HAS_TOKEN: ${{ secrets.INFRA_PR_TOKEN != '' }}
    steps:
      - name: Set the hub's tag on infra main
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.INFRA_PR_TOKEN }}
          OWN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: weavertech-group/infra
          FILE: apps/kinmesh/kustomization.yaml
          IMAGE: ghcr.io/${{ github.repository_owner }}/kinmesh
        run: |
          set -euo pipefail
          # Only the newest commit on main is deployed; an older run that
          # finishes late changes nothing.
          head=$(GH_TOKEN="$OWN_TOKEN" gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main is at $head now; its own run deploys it."
            exit 0
          fi
          cd "$RUNNER_TEMP"
          message=$(printf 'deploy: Kinmesh hub %s\n\nRuns %s:%s, published from %s/%s/commit/%s.' \
            "${GITHUB_SHA::7}" "$IMAGE" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA")
          # A commit to the file on infra main between the read and the write
          # fails the write with 409; then it reads again, once.
          for attempt in 1 2; do
            gh api "repos/$REPO/contents/$FILE?ref=main" > file.json
            jq -r .content file.json | base64 -d > current.yaml
            # The tag under this image's entry, and nothing else.
            awk -v entry="  - name: $IMAGE" -v tag="$GITHUB_SHA" '
              /^  - name: / { inside = ($0 == entry) }
              inside && /^    newTag: / { $0 = "    newTag: " tag; changed = 1 }
              { print }
              END { if (!changed) exit 1 }
            ' current.yaml > updated.yaml
            if cmp -s current.yaml updated.yaml; then
              echo "The deployment already runs $GITHUB_SHA."
              exit 0
            fi
            if gh api -X PUT "repos/$REPO/contents/$FILE" \
              -f branch=main \
              -f sha="$(jq -r .sha file.json)" \
              -f message="$message" \
              -f content="$(base64 -w0 updated.yaml)" \
              --jq '"Committed " + .commit.html_url' 2> error.txt; then
              exit 0
            fi
            cat error.txt >&2
            if [ "$attempt" = 2 ] || ! grep -q 'HTTP 409' error.txt; then
              exit 1
            fi
          done
