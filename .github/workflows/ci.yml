name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - name: Unit, persistence, HTTP and independent Team MCP SDK process tests
        run: npm test
      - name: Generated migration drift
        run: |
          npm run db:generate
          test -z "$(git status --porcelain -- drizzle)"
      - run: npm run architecture
      - run: npm audit --omit=dev
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Real Chromium against Kinmesh; native T3 DTO cases remain fixtures
        run: npm run test:browser
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the image (publishing is a separate, deliberate step)
        run: docker build -t kinmesh:ci .
      - name: The container is healthy against a fresh database
        run: |
          docker run -d --name kinmesh \
            -e KINMESH_SESSION_KEY="$(openssl rand -hex 32)" \
            -e FEISHU_APP_ID=cli_ci -e FEISHU_APP_SECRET=ci-secret \
            -e KINMESH_EMAIL_DOMAIN=example.com \
            kinmesh:ci
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' kinmesh)"
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && break
            sleep 2
          done
          docker logs kinmesh
          test "$status" = healthy
      - name: It runs as a non-root user and carries no tests, secrets or source maps
        run: |
          test "$(docker exec kinmesh id -u)" != 0
          docker exec kinmesh sh -c 'test ! -e /app/tests && test ! -e /app/.env && test -z "$(find /app/dist -name "*.map" -o -name "*.ts")"'
      - if: always()
        run: docker rm -f kinmesh || true
