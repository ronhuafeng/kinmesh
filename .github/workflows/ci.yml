name: Foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Unit, persistence, HTTP and independent Team MCP SDK process tests
        run: npm test
      - name: Generated migration drift
        run: |
          npm run db:generate
          test -z "$(git status --porcelain -- drizzle)"
      - run: npm run architecture
      - run: npm audit --omit=dev
