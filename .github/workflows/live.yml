name: Live collaboration
on:
  workflow_dispatch:
    inputs:
      executor:
        description: Executor to run
        type: choice
        options: [both, codex, grok]
        default: both
      through:
        description: Stop after this stage; empty runs every stage
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: kinmesh-live
  cancel-in-progress: false
jobs:
  collaboration:
    name: live-${{ matrix.executor }}
    runs-on: ubuntu-24.04
    environment: live
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        executor: ${{ fromJSON(inputs.executor == 'both' && '["codex","grok"]' || format('["{0}"]', inputs.executor)) }}
    steps:
      - name: Require owner manual dispatch on main before repository execution
        shell: bash
        run: |
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$GITHUB_TRIGGERING_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Install exact native releases
        run: bash tests/live/install.sh
      - name: Complete real collaboration, rework, recovery and authority verification
        env:
          KINMESH_LIVE_EXECUTOR: ${{ matrix.executor }}
          KINMESH_LIVE_THROUGH: ${{ inputs.through }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          CODEX_BASE_URL: ${{ secrets.CODEX_BASE_URL }}
          GROK_BASE_URL: ${{ secrets.GROK_BASE_URL }}
        run: npm run test:collaboration-live
      - name: Bounded redacted evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-${{ matrix.executor }}-${{ github.sha }}
          path: .live-evidence/*.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
