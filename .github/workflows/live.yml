name: Live collaboration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kinmesh-live
  cancel-in-progress: false
jobs:
  collaboration:
    name: live-${{ matrix.executor }}
    runs-on: ubuntu-24.04
    environment: live
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        executor: [codex, grok]
    steps:
      - name: Reject any non-main manual dispatch before repository execution
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::approval-required: only refs/heads/main is eligible"
            exit 1
          fi
      - name: Owner-native approval-required
        id: owner-approval
        shell: bash
        run: |
          echo "::error::approval-required: owner must personally consent and approve in native T3; this unattended runner cannot do so"
          exit 1
      - name: Bounded redacted evidence, including failures
        # A blocked dispatch has no native evidence; do not obscure its failed gate.
        if: ${{ always() && steps.owner-approval.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-${{ matrix.executor }}-${{ github.sha }}
          path: .live-evidence/*.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
