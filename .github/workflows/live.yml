name: Live collaboration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kinmesh-live
  cancel-in-progress: false
jobs:
  collaboration:
    name: live-${{ matrix.executor }}
    runs-on: ubuntu-24.04
    environment: live
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        executor: [codex, grok]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Install exact native releases
        run: bash tests/live/install.sh
      - name: Complete real collaboration, rework, recovery and authority verification
        env:
          KINMESH_LIVE_EXECUTOR: ${{ matrix.executor }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          CODEX_BASE_URL: ${{ secrets.CODEX_BASE_URL }}
          GROK_BASE_URL: ${{ secrets.GROK_BASE_URL }}
        run: npm run test:collaboration-live
      - name: Bounded redacted evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-${{ matrix.executor }}-${{ github.sha }}
          path: .live-evidence/*.json
          if-no-files-found: error
          retention-days: 14
